<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>RoomBook - Add Employee</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 25px 40px;
        }

        .header h1 {
            font-size: 30px;
        }

        .header p {
            margin-top: 5px;
            opacity: 0.9;
        }

        .container {
            width: 650px;
            max-width: 95%;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .btn {
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
            flex: 1;
        }

        .back-btn {
            background: #64748b;
            color: white;
        }

        button:hover,
        .btn:hover {
            opacity: 0.9;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>RoomBook</h1>

    <p>Employee Management</p>

</div>


<div class="container">

    <div class="card">

        <h2 id="formTitle">
            Add Employee
        </h2>


        <div id="successMessage"
             class="message success">
        </div>


        <div id="errorMessage"
             class="message error">
        </div>


        <form id="employeeForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Employee Name
                </label>

                <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                        required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter employee email"
                        required>

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                        required>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status" required>

                    <option value="">
                        Select status
                    </option>

                    <option value="ACTIVE">
                        ACTIVE
                    </option>

                    <option value="INACTIVE">
                        INACTIVE
                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                        type="submit"
                        class="submit-btn"
                        id="submitButton">

                    Save Employee

                </button>


                <a
                        href="/employees"
                        class="btn back-btn">

                    Cancel

                </a>

            </div>


        </form>

    </div>

</div>


<script>

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const employeeId =
        urlParams.get("id");


    // Edit mode

    if (employeeId) {

        document.getElementById(
            "formTitle"
        ).innerText =
            "Edit Employee";

        document.getElementById(
            "submitButton"
        ).innerText =
            "Update Employee";

        loadEmployee(employeeId);

    }


    async function loadEmployee(id) {

        try {

            const response =
                await fetch(
                    "/api/employees/" + id
                );


            if (!response.ok) {

                throw new Error(
                    "Employee not found"
                );

            }


            const employee =
                await response.json();


            document.getElementById(
                "name"
            ).value =
                employee.name || "";


            document.getElementById(
                "email"
            ).value =
                employee.email || "";


            document.getElementById(
                "department"
            ).value =
                employee.department || "";


            document.getElementById(
                "phone"
            ).value =
                employee.phone || "";


            document.getElementById(
                "status"
            ).value =
                employee.status || "";

        }

        catch (error) {

            showError(
                "Failed to load employee."
            );

        }

    }


    document.getElementById(
        "employeeForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            hideMessages();


            const employeeData = {

                name:
                    document.getElementById(
                        "name"
                    ).value.trim(),

                email:
                    document.getElementById(
                        "email"
                    ).value.trim(),

                department:
                    document.getElementById(
                        "department"
                    ).value.trim(),

                phone:
                    document.getElementById(
                        "phone"
                    ).value.trim(),

                status:
                    document.getElementById(
                        "status"
                    ).value

            };


            try {

                let url =
                    "/api/employees";

                let method =
                    "POST";


                // Edit

                if (employeeId) {

                    url =
                        "/api/employees/"
                        + employeeId;

                    method =
                        "PUT";

                }


                const response =
                    await fetch(
                        url,
                        {
                            method: method,

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    employeeData
                                )
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    if (result.messages) {

                        const messages =
                            Object.values(
                                result.messages
                            ).join("\n");

                        showError(messages);

                    } else {

                        showError(
                            result.message ||
                            "Operation failed."
                        );

                    }

                    return;

                }


                showSuccess(
                    employeeId
                    ? "Employee updated successfully!"
                    : "Employee added successfully!"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "/employees";

                    },
                    1000
                );

            }

            catch (error) {

                showError(
                    "Something went wrong."
                );

            }

        }
    );


    function showError(message) {

        const error =
            document.getElementById(
                "errorMessage"
            );

        error.innerText =
            message;

        error.style.display =
            "block";

    }


    function showSuccess(message) {

        const success =
            document.getElementById(
                "successMessage"
            );

        success.innerText =
            message;

        success.style.display =
            "block";

    }


    function hideMessages() {

        document.getElementById(
            "errorMessage"
        ).style.display =
            "none";

        document.getElementById(
            "successMessage"
        ).style.display =
            "none";

    }

</script>


</body>

</html>
