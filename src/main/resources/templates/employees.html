<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>RoomBook - Employees</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 25px 40px;
        }

        .header h1 {
            font-size: 30px;
        }

        .header p {
            margin-top: 5px;
            opacity: 0.9;
        }

        .container {
            width: 95%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            color: #1e3a8a;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            text-decoration: none;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn {
            background: #64748b;
        }

        .edit-btn {
            background: #2563eb;
        }

        .delete-btn {
            background: #dc2626;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8fafc;
        }

        .admin-actions {
            display: flex;
            gap: 7px;
        }

        .admin-actions .btn {
            padding: 7px 11px;
            font-size: 12px;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>RoomBook</h1>

    <p>Meeting Room Management</p>

</div>


<div class="container">


    <div class="top-bar">

        <h2>
            Employee Management
        </h2>


        <div class="actions">

            <a
                    href="/add-employee"
                    class="btn">

                + Add Employee

            </a>


            <a
                    href="/"
                    class="btn back-btn">

                ← Dashboard

            </a>

        </div>

    </div>


    <div
            id="errorMessage"
            class="error">

        Failed to load employees.

    </div>


    <div class="table-container">

        <h2>
            All Employees
        </h2>


        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Department</th>

                <th>Phone</th>

                <th>Status</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody id="employeeTableBody">

            </tbody>

        </table>

    </div>

</div>


<script>


    async function loadEmployees() {

        try {

            const response =
                await fetch("/api/employees");


            if (!response.ok) {

                throw new Error(
                    "Failed to load employees"
                );

            }


            const employees =
                await response.json();


            const tableBody =
                document.getElementById(
                    "employeeTableBody"
                );


            tableBody.innerHTML = "";


            if (employees.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="no-data">

                            No employees available.

                        </td>

                    </tr>

                `;

                return;
            }


            employees.forEach(employee => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${employee.id}
                    </td>

                    <td>
                        ${employee.name}
                    </td>

                    <td>
                        ${employee.email}
                    </td>

                    <td>
                        ${employee.department}
                    </td>

                    <td>
                        ${employee.phone}
                    </td>

                    <td>
                        ${employee.status}
                    </td>

                    <td>

                        <div class="admin-actions">

                            <button
                                class="btn edit-btn"
                                onclick="editEmployee(${employee.id})">

                                Edit

                            </button>


                            <button
                                class="btn delete-btn"
                                onclick="deleteEmployee(${employee.id})">

                                Delete

                            </button>

                        </div>

                    </td>

                `;


                tableBody.appendChild(row);

            });

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "errorMessage"
            ).style.display = "block";

        }

    }



    function editEmployee(id) {

        window.location.href =
            "/add-employee?id=" + id;

    }



    async function deleteEmployee(id) {

        if (
            !confirm(
                "Are you sure you want to delete this employee?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    "/api/employees/" + id,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const error =
                    await response.json();

                alert(
                    error.message ||
                    "Delete failed"
                );

                return;
            }


            alert(
                "Employee deleted successfully!"
            );


            loadEmployees();

        }

        catch (error) {

            alert(
                "Failed to delete employee"
            );

        }

    }



    loadEmployees();

</script>


</body>

</html>
